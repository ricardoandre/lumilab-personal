# PRODUCTION vhost for personal.lumilabcreative.com -> lumilab-personal prod on :3003.
#
# Modelled on /etc/nginx/sites-enabled/app.kano.id, deliberately: the deploying
# page, the maintenance switch and the 503-not-200 behaviour all exist because of
# real kanoapp outages, and there is no reason for a second app to relearn them.
#
# INSTALL (one command, in the block below this file's path):
#   sudo cp .../personal.lumilabcreative.com.conf /etc/nginx/sites-available/personal.lumilabcreative.com
#   sudo ln -sf /etc/nginx/sites-available/... /etc/nginx/sites-enabled/...
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d personal.lumilabcreative.com     # adds the SSL block
#
# certbot rewrites this file in place to add listen 443 + the cert paths, exactly
# as it did for app.kano.id. Nothing here needs to be pre-written for SSL.

server {
    listen 80;
    server_name personal.lumilabcreative.com;

    # Matches app.kano.id: the app caps uploads at 10MB itself, nginx sits just
    # above so a large photo fails in the app with a real message rather than
    # being cut off at the proxy with a bare 413.
    client_max_body_size 20M;

    proxy_intercept_errors on;
    error_page 502 504 = @deploying;
    error_page 503 = @maintenance;

    # Brief 502/504 during a pm2 slot-switch -> auto-refreshing "deploying" page.
    # Returns 503, NOT 200: a 200 here once told every health check that a dead
    # site was healthy, and go-live printed "LIVE" through a six-minute crash loop.
    location @deploying {
        default_type text/html;
        add_header Retry-After 2 always;
        add_header Cache-Control "no-store" always;
        return 503 '<!DOCTYPE html><html><head><meta charset="utf-8"><meta http-equiv="refresh" content="2"><title>Deploying...</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf9f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#211f1c;}main{text-align:center;padding:24px;}h1{font-size:16px;font-weight:700;margin:0 0 6px;}p{font-size:13px;color:#726c63;margin:0;}.dot{width:8px;height:8px;border-radius:50%;background:#26344b;display:inline-block;margin-bottom:14px;animation:pulse 1.2s ease-in-out infinite;}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}</style></head><body><main><div class="dot"></div><h1>Deploying an update</h1><p>This page will refresh automatically in a couple seconds.</p></main></body></html>';
    }

    # MAINTENANCE SWITCH — while the flag file exists every request gets this page:
    #   sudo touch /etc/nginx/lumilab-personal-maintenance && sudo systemctl reload nginx
    #   sudo rm -f /etc/nginx/lumilab-personal-maintenance && sudo systemctl reload nginx
    location @maintenance {
        default_type text/html;
        add_header Retry-After 3600 always;
        add_header Cache-Control "no-store" always;
        return 503 '<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Maintenance</title><style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#faf9f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#211f1c;}main{text-align:center;padding:28px;max-width:440px;}.dot{width:10px;height:10px;border-radius:50%;background:#26344b;display:inline-block;margin-bottom:18px;animation:pulse 1.2s ease-in-out infinite;}h1{font-size:19px;font-weight:700;margin:0 0 10px;}p{font-size:14px;line-height:1.5;color:#726c63;margin:0;}@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}</style></head><body><main><div class="dot"></div><h1>Under maintenance</h1><p>Back shortly. No action is needed.</p></main></body></html>';
    }

    location / {
        if (-f /etc/nginx/lumilab-personal-maintenance) { return 503; }
        proxy_pass http://localhost:3003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
